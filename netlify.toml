[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://raw.githubusercontent.com blob:; img-src 'self' data: blob:; worker-src 'self' blob:;"
    X-Frame-Options = "SAMEORIGIN"
