<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows XP - v86</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Windows XP VM</h1>
    <p class="info">v86 Emulator | 256MB RAM | Browser Sandbox</p>

    <!-- Loader -->
    <div id="loader">
        <h2 id="loader-title">Loading...</h2>
        <div id="loader-status">Checking environment...</div>
        <div id="loader-error" class="hidden"></div>
    </div>

    <!-- Iframe mode (for GitHub Pages) -->
    <div id="iframe-mode" class="hidden">
        <iframe id="v86-frame" src="" allow="fullscreen"></iframe>
        <div class="controls">
            <button onclick="frame('restart')">Restart</button>
            <button onclick="frame('cad')">Ctrl+Alt+Del</button>
            <button onclick="frame('save')">Save State</button>
            <button onclick="fullscreen()">Fullscreen</button>
        </div>
        <div id="iframe-status">Loading VM...</div>
    </div>

    <!-- Native mode (for Netlify/Vercel) -->
    <div id="emulator" class="hidden">
        <div id="screen-container"></div>
        <div class="controls">
            <button id="btn-start">Start</button>
            <button id="btn-stop" disabled>Stop</button>
            <button id="btn-restart" disabled>Restart</button>
            <button id="btn-fullscreen">Fullscreen</button>
            <button id="btn-save-state" disabled>Save State</button>
            <button id="btn-ctrlaltdel" disabled>Ctrl+Alt+Del</button>
        </div>
        <div id="status">Status: Ready</div>
    </div>

    <script src="src/logger.js"></script>
    <script src="config.js"></script>
    <script>
    const $=s=>document.getElementById(s);

    // CSP check
    function canEval(){try{return new Function('return 1')()===1}catch(e){return false}}

    // Iframe helpers
    function frame(t,d){$('v86-frame').contentWindow.postMessage({t,d},'*')}
    function fullscreen(){
        const el=$('v86-frame')||$('screen-container');
        document.fullscreenElement?document.exitFullscreen():el?.requestFullscreen();
    }

    // Init
    document.addEventListener('DOMContentLoaded',()=>{
        Logger.info('App','Init - canEval='+canEval());

        if(canEval()){
            // Native mode
            $('loader-title').textContent='Loading v86 Engine';
            const s=document.createElement('script');
            s.src='src/api.js';
            s.onload=()=>{
                const s2=document.createElement('script');s2.src='src/cache.js';
                s2.onload=()=>{
                    const s3=document.createElement('script');s3.src='src/loader.js';
                    s3.onload=()=>{
                        const s4=document.createElement('script');s4.src='src/emulator.js';
                        s4.onload=()=>{
                            const s5=document.createElement('script');s5.src='src/ui.js';
                            s5.onload=()=>{
                                const s6=document.createElement('script');s6.src='app.js';
                                document.body.appendChild(s6);
                            };document.body.appendChild(s5);
                        };document.body.appendChild(s4);
                    };document.body.appendChild(s3);
                };document.body.appendChild(s2);
            };document.body.appendChild(s);
        }else{
            // Iframe mode
            Logger.warn('App','CSP blocks eval - using iframe');
            $('loader').classList.add('hidden');
            $('iframe-mode').classList.remove('hidden');

            // Build iframe URL
            let embedUrl=VM_CONFIG.embed_url;
            if(!embedUrl){
                $('iframe-status').textContent='Error: Set VM_CONFIG.embed_url to your Netlify URL';
                $('iframe-status').style.color='#f00';
                return;
            }

            const p=new URLSearchParams();
            if(VM_CONFIG.hda_url)p.set('hda',VM_CONFIG.hda_url);
            if(VM_CONFIG.initial_state)p.set('state',VM_CONFIG.initial_state);
            p.set('mem',VM_CONFIG.memory_size||268435456);

            $('v86-frame').src=embedUrl+(embedUrl.includes('?')?'&':'?')+p.toString();

            // Listen for iframe messages
            window.addEventListener('message',e=>{
                if(e.data?.t==='ready')$('iframe-status').textContent='VM Running';
                if(e.data?.t==='state'){
                    const a=document.createElement('a');
                    a.href=URL.createObjectURL(new Blob([e.data.d]));
                    a.download='state.bin';a.click();
                }
            });
        }
    });
    </script>
</body>
</html>
